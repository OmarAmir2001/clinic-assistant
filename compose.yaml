# compose.yaml: the whole setup in one file
#   docker compose up -d db      start only the database
#   docker compose up -d         start the database and the API
services:
  db:
    image: pgvector/pgvector:pg17          # PostgreSQL 17 with pgvector inside
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # read from your .env
      POSTGRES_DB: clinic
    ports:
      - "5432:5432"                        # your laptop's port : the container's port
    volumes:
      - pgdata:/var/lib/postgresql/data    # the data lives in the volume, not in the container

  api:
    build: .                               # build the image from our Dockerfile
    env_file: .env                         # the same settings as on your laptop...
    environment:
      POSTGRES_HOST: db                    # ...except this: the database's name on Docker's network
    ports:
      - "8000:8000"
    depends_on:
      - db                                 # start db first

volumes:
  pgdata:
