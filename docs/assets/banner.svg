<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Clinic Booking Assistant: an agentic RAG assistant for Nile Family Clinic" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .t { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
    .ar { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; }
    .float1 { animation: f1 6s ease-in-out infinite; }
    .float2 { animation: f2 7s ease-in-out infinite; }
    .head { transform-origin: 1035px 210px; animation: tilt 6s ease-in-out infinite; }
    .blink { transform-origin: 1035px 206px; animation: blink 5s linear infinite; }
    .glow { animation: glow 3s ease-in-out infinite; }
    .dot { animation: dot 1.4s ease-in-out infinite; }
    .dot.d2 { animation-delay: .2s; } .dot.d3 { animation-delay: .4s; }
    @keyframes f1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes f2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
    @keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-5px); } }
    @keyframes blink { 0%,44% { transform: scaleY(1); } 46% { transform: scaleY(.1); } 48%,100% { transform: scaleY(1); } }
    @keyframes glow { 0%,100% { opacity: .45; } 50% { opacity: .95; } }
    @keyframes dot { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1736"/><stop offset=".55" stop-color="#14306B"/><stop offset="1" stop-color="#0E6E7E"/>
    </linearGradient>
    <radialGradient id="halo" cx=".8" cy=".5" r=".45"><stop offset="0" stop-color="#25C2E6" stop-opacity=".35"/><stop offset="1" stop-color="#25C2E6" stop-opacity="0"/></radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3D9E2"/></linearGradient>
    <radialGradient id="visor" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#1E4E86"/><stop offset="1" stop-color="#081530"/></radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B6F6FF"/><stop offset="1" stop-color="#25C2E6"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="vclip"><path d="M1035 133 C1090 133 1122 164 1122 207 C1122 247 1087 267 1035 267 C983 267 948 247 948 207 C948 164 980 133 1035 133Z"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/></pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#halo)"/>
  <circle cx="120" cy="360" r="140" fill="#25C2E6" opacity=".07"/>
  <circle cx="1210" cy="40" r="90" fill="#FFB547" opacity=".08"/>

  <!-- title -->
  <g class="t">
    <text x="72" y="92" fill="#FFB547" font-size="18" font-weight="700" letter-spacing="4">AI ENGINEERING WITH PYTHON · PROGRAM 1</text>
    <text x="72" y="164" fill="#FFFFFF" font-size="58" font-weight="800">Clinic Booking Assistant</text>
    <text x="72" y="214" fill="#C9D6F2" font-size="24">An agentic RAG assistant for Nile Family Clinic:</text>
    <text x="72" y="248" fill="#C9D6F2" font-size="24">it answers from the clinic's own documents, and books after a yes.</text>
  </g>
  <!-- pills -->
  <g class="t" font-size="16" font-weight="700">
    <rect x="72" y="282" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/>
    <text x="147" y="307" fill="#FFFFFF" text-anchor="middle">Arabic + English</text>
    <rect x="234" y="282" width="128" height="38" rx="19" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/>
    <text x="298" y="307" fill="#FFFFFF" text-anchor="middle">Hybrid search</text>
    <rect x="374" y="282" width="150" height="38" rx="19" fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-opacity=".25"/>
    <text x="449" y="307" fill="#FFFFFF" text-anchor="middle">Cited answers</text>
    <rect x="536" y="282" width="128" height="38" rx="19" fill="#FFB547"/>
    <text x="600" y="307" fill="#14213D" text-anchor="middle">6 tools</text>
  </g>

  <!-- chat bubbles -->
  <g transform="translate(80 -48)"><g class="float1" filter="url(#shadow)">
    <path d="M760 74 H930 Q942 74 942 86 V124 Q942 136 930 136 H790 L770 152 L774 136 H760 Q748 136 748 124 V86 Q748 74 760 74Z" fill="#FFFFFF"/>
    <text x="845" y="102" class="t" font-size="15" fill="#14213D" text-anchor="middle" font-weight="600">Is Dr. Mona free</text>
    <text x="845" y="122" class="t" font-size="15" fill="#14213D" text-anchor="middle" font-weight="600">on Sunday?</text>
  </g></g>
  <g class="float2" filter="url(#shadow)">
    <path d="M1122 292 H1236 Q1248 292 1248 304 V342 Q1248 354 1236 354 H1146 L1130 368 L1132 354 H1122 Q1110 354 1110 342 V304 Q1110 292 1122 292Z" fill="#FFB547"/>
    <text x="1179" y="330" class="ar" font-size="17" fill="#14213D" text-anchor="middle" font-weight="700">بكام الكشف؟</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="292" width="148" height="46" rx="23" fill="#0B1736" stroke="#25C2E6" stroke-opacity=".6"/>
    <circle class="dot" cx="806" cy="315" r="6" fill="#25C2E6"/><circle class="dot d2" cx="834" cy="315" r="6" fill="#25C2E6"/><circle class="dot d3" cx="862" cy="315" r="6" fill="#25C2E6"/>
  </g>

  <!-- the robot -->
  <g class="head" filter="url(#shadow)">
    <rect x="925" y="174" width="30" height="62" rx="12" fill="#1F2430"/><rect x="945" y="180" width="5" height="50" rx="2.5" fill="#25C2E6"/>
    <rect x="1115" y="174" width="30" height="62" rx="12" fill="#1F2430"/><rect x="1120" y="180" width="5" height="50" rx="2.5" fill="#25C2E6"/>
    <rect x="1017" y="104" width="36" height="14" rx="7" fill="#25C2E6"/>
    <path d="M1035 112 C1099 112 1136 149 1136 207 C1136 255 1095 282 1035 282 C975 282 934 255 934 207 C934 149 971 112 1035 112Z" fill="url(#shell)" stroke="#BFC6D1" stroke-width="2"/>
    <path d="M1035 133 C1090 133 1122 164 1122 207 C1122 247 1087 267 1035 267 C983 267 948 247 948 207 C948 164 980 133 1035 133Z" fill="url(#visor)" stroke="#05080F" stroke-width="4"/>
    <g clip-path="url(#vclip)">
      <g class="glow" filter="url(#blur)" fill="#25C2E6"><ellipse cx="1004" cy="203" rx="22" ry="19"/><ellipse cx="1066" cy="203" rx="22" ry="19"/></g>
      <g class="blink" fill="url(#eye)"><ellipse cx="1004" cy="203" rx="22" ry="19"/><ellipse cx="1066" cy="203" rx="22" ry="19"/></g>
      <path d="M1019 238 Q1035 249 1051 238" fill="none" stroke="url(#eye)" stroke-width="7" stroke-linecap="round"/>
      <path d="M976 160 C994 146 1014 142 1040 142" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
